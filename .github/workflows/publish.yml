# Builds the image GitHub hosts, and refuses to publish one whose tests fail.
#
# A pull request builds both architectures but pushes nothing, so a broken
# Dockerfile is caught before it can reach the registry and before anyone's
# `docker compose pull` picks it up.
name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer commit on the same ref makes an in-flight build pointless, and the
  # arm64 leg is slow enough that overlapping runs actually collide.
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # requirements-dev.txt pulls in requirements.txt, so this is the whole set.
      # ffmpeg is not installed: the suite never shells out to it.
      - run: pip install -r requirements-dev.txt

      - run: pytest tests/ -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The only elevated permission here, and the only one GHCR needs.
      packages: write
    steps:
      - uses: actions/checkout@v4

      # arm64 is emulated. It is the slow half of the build, and it is the half
      # an Apple Silicon machine actually runs.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Skipped on pull requests, which have no write token and push nothing.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # github.repository is loubylabs/Toniefi, and GHCR rejects the capital
          # T. This action lowercases the name, which is why it is built here.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without a cache every run reinstalls ffmpeg and every wheel twice,
          # once per architecture.
          cache-from: type=gha
          cache-to: type=gha,mode=max
