# One file for every host, and the only file an installation needs: download it
# on its own and docker compose up. It runs as-is on Docker Desktop (macOS,
# Windows) and on plain Linux, keeping the library in the folder that holds
# this file. Unraid, or anyone who wants the library elsewhere, overrides the
# paths in a .env file next to this one. See .env.example, which the README
# links by raw URL. The image comes from GHCR: docker compose pull is how you
# take an update.
services:
  toniefi:
    # Built and hosted by GitHub, so a host does not compile ffmpeg and every
    # wheel itself. To run your own local changes instead, use ./run-local.sh.
    image: ghcr.io/loubylabs/toniefi:latest
    container_name: toniefi
    restart: unless-stopped
    ports:
      # Change TONIEFI_PORT if 8080 is already taken on your machine.
      - "${TONIEFI_PORT:-8080}:8080"
    # Root by default, which is what Docker Desktop wants: it maps ownership
    # back to you on the host. On plain Linux, set TONIEFI_UID/TONIEFI_GID to
    # your own ids, or everything the container writes into the library lands
    # owned by root and you cannot delete it without sudo.
    user: "${TONIEFI_UID:-0}:${TONIEFI_GID:-0}"
    environment:
      # Leave these unset to enter credentials in the UI instead.
      TONIES_USERNAME: "${TONIES_USERNAME:-}"
      TONIES_PASSWORD: "${TONIES_PASSWORD:-}"
      # A Creative Tonie holds 90 minutes; headroom guards against rounding.
      TONIE_LIMIT_SECONDS: "${TONIE_LIMIT_SECONDS:-5400}"
      TONIE_HEADROOM_SECONDS: "${TONIE_HEADROOM_SECONDS:-30}"
      WORKER_THREADS: "${WORKER_THREADS:-2}"
      # Retained upload inputs live separately from disposable /work scratch.
      UPLOAD_STAGE_DIR: "${UPLOAD_STAGE_DIR:-/data/upload-staging}"
      # Which YouTube clients yt-dlp may ask as. See the README when a link
      # reports itself unavailable despite playing in a browser.
      YTDLP_PLAYER_CLIENTS: "${YTDLP_PLAYER_CLIENTS:-default,android}"
    volumes:
      # Your audiobooks. Relative paths resolve against this file's directory.
      - ${TONIEFI_LIBRARY:-./library}:/library
      # Job history, saved settings, and retained upload inputs.
      - ${TONIEFI_DATA:-./data}:/data
      # Disposable downloads and transcodes live on host storage. Point this
      # at a fast SSD with enough room for the largest source you will prepare.
      - ${TONIEFI_WORK:-./work}:/work
