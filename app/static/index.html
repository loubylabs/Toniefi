<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b2a20">
  <title>TonieFi</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- DIRECTION CONTRACT
  THESIS: TonieFi is a working circulation desk for stories. It refuses the generic dark dashboard and linear setup wizard.
  OWN-WORLD: Deep bottle-green bookcloth, cool utility paper, chartreuse action ink, periwinkle information ink, square status stamps, thin rules, full-color cover jackets, and compact service labels.
  STORY: Add several sources, watch each move independently through preparation, then pick the ready jackets in the Library and send them to their Creative Tonies.
  FIRST VIEWPORT: The service index occupies the left, batch intake owns the center, and the live work cart remains visible at right. The count-aware preparation action closes the intake tray.
  FORM: Command Desk, selected from three Circulation Desk compositions. Seed key 17e3c753.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
  -->
  <a class="skip-link" href="#workspace">Skip to workspace</a>

  <div class="application-shell">
    <aside class="service-index" aria-label="TonieFi service index">
      <a class="wordmark" href="/" data-route="desk" aria-label="TonieFi Desk">
        <span class="wordmark-mark" data-icon="brand" aria-hidden="true"></span>
        <span>TonieFi</span>
      </a>

      <nav class="desktop-navigation" aria-label="Primary">
        <a href="/" data-route="desk">
          <span data-icon="desk" aria-hidden="true"></span>
          <span>Desk</span>
        </a>
        <a href="/library" data-route="library">
          <span data-icon="library" aria-hidden="true"></span>
          <span>Library</span>
        </a>
        <a href="/tonies" data-route="tonies">
          <span data-icon="tonie" aria-hidden="true"></span>
          <span>Creative Tonies</span>
        </a>
        <a href="/activity" data-route="activity">
          <span data-icon="activity" aria-hidden="true"></span>
          <span>Activity</span>
          <span class="nav-job-status" id="activityStatus" hidden aria-label="jobs active">
            <span data-icon="clock" aria-hidden="true"></span>
            <span id="activityCount"></span>
          </span>
        </a>
        <a href="/settings" data-route="settings">
          <span data-icon="settings" aria-hidden="true"></span>
          <span>Settings</span>
        </a>
      </nav>

      <section class="account-summary" id="accountSummary" aria-label="myTonies account status" aria-live="polite">
        <span class="account-summary-icon" data-icon="account" aria-hidden="true"></span>
        <span>
          <strong>Checking account</strong>
          <small>myTonies connection</small>
        </span>
      </section>
    </aside>

    <main id="workspace" tabindex="-1">
      <section class="route-pending" aria-labelledby="opening-title">
        <span class="route-pending-mark" data-icon="brand" aria-hidden="true"></span>
        <h1 id="opening-title">Opening the circulation desk</h1>
        <p>Gathering your local library and current work.</p>
      </section>
    </main>
  </div>

  <div class="persistent-utilities">
    <div class="notification-region" id="notifications" aria-label="Notifications"></div>
    <section class="audio-player-host" id="audioPlayerHost" aria-label="Audio player" hidden></section>
  </div>
  <div class="visually-hidden" id="liveRegion" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="dialogHost"></div>

  <nav class="mobile-navigation" aria-label="Mobile primary">
    <a href="/" data-route="desk">
      <span data-icon="desk" aria-hidden="true"></span>
      <span>Desk</span>
    </a>
    <a href="/library" data-route="library">
      <span data-icon="library" aria-hidden="true"></span>
      <span>Library</span>
    </a>
    <a href="/tonies" data-route="tonies">
      <span data-icon="tonie" aria-hidden="true"></span>
      <span>Creative Tonies</span>
    </a>
    <button type="button" id="mobileMoreButton" aria-expanded="false" aria-controls="mobileMoreMenu">
      <span data-icon="more" aria-hidden="true"></span>
      <span>More</span>
    </button>
    <div class="mobile-more-menu" id="mobileMoreMenu" hidden>
      <a href="/activity" data-route="activity">
        <span data-icon="activity" aria-hidden="true"></span>
        <span>Activity</span>
      </a>
      <a href="/settings" data-route="settings">
        <span data-icon="settings" aria-hidden="true"></span>
        <span>Settings</span>
      </a>
    </div>
  </nav>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
